<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Flappy Gary</title>
  <style>
    body {
      margin: 0;
      background: #87ceeb;
      color: #1b1b1b;
      font-family: "Trebuchet MS", sans-serif;
    }
    main {
      display: flex;
      gap: 24px;
      justify-content: center;
      padding: 32px;
    }
    section {
      width: 360px;
      min-height: 520px;
      background: #f7fbff;
      border: 4px solid #1b1b1b;
      border-radius: 12px;
      padding: 24px;
      box-sizing: border-box;
    }
    h1, h2 {
      text-align: center;
      margin: 12px 0 24px;
    }
    button, label {
      display: block;
      width: 100%;
      margin: 12px 0;
      font-size: 18px;
    }
    button {
      padding: 12px 16px;
    }
    p {
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <section id="menu-scene">
      <h1>Flappy Gary</h1>
      <button type="button" id="start-button">Start Game</button>
      <button type="button" id="settings-button">Settings</button>
      <p>Tap to make Gary fly! Avoid the pipes!</p>
    </section>
    <section id="settings-scene">
      <h2 id="settings-title">Settings</h2>
      <label for="volume-slider">Volume:</label>
      <input id="volume-slider" type="range" min="0" max="1" step="0.05" value="1">
      <p id="difficulty-label">Difficulty: medium</p>
      <button type="button" id="difficulty-button">Change Difficulty</button>
      <button type="button" id="back-button">Back to Menu</button>
    </section>
  </main>
  <script>
    var difficulties = ["easy", "medium", "hard"];
    var difficultyIndex = 1;

    function showSettings() {
      document.getElementById("settings-scene").scrollIntoView();
    }

    function changeDifficulty() {
      difficultyIndex = (difficultyIndex + 1) % difficulties.length;
      document.getElementById("difficulty-label").textContent =
        "Difficulty: " + difficulties[difficultyIndex];
    }

    document.getElementById("settings-button").addEventListener("click", showSettings);
    document.getElementById("difficulty-button").addEventListener("click", changeDifficulty);
    document.getElementById("back-button").addEventListener("click", function () {
      document.getElementById("menu-scene").scrollIntoView();
    });
  </script>
</body>
</html>
